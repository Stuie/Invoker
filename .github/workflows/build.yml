name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Default to bash everywhere so `./gradlew …` works on the Windows runner too (default pwsh
# can't execute the shell script wrapper without `.bat`).
defaults:
  run:
    shell: bash

jobs:
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build & test (${{ matrix.label }})
    needs: wrapper
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
          # macOS: arm64 only. GitHub retired the free macos-13 (Intel) runner pool in 2025;
          # the label is still accepted but jobs sit in the queue forever. Intel Mac users
          # have no Apple-provided arm64→x86_64 translation path, so they can't use this
          # DMG natively — they'd need to build from source or run from a different machine.
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew :shared:jvmTest :desktopApp:createDistributable

      - name: Upload distributable (failures and main only)
        if: failure() || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: invoker-${{ matrix.label }}
          path: desktopApp/build/compose/binaries/main/app/
          retention-days: 7
