name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Default to bash everywhere so `./gradlew …` works on the Windows runner too (default pwsh
# can't execute the shell script wrapper without `.bat`).
defaults:
  run:
    shell: bash

jobs:
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

  build:
    name: Build & test (${{ matrix.label }})
    needs: wrapper
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
          # macOS: arm64 only. GitHub retired the free macos-13 (Intel) runner pool in 2025;
          # the label is still accepted but jobs sit in the queue forever. Intel Mac users
          # have no Apple-provided arm64→x86_64 translation path, so they can't use this
          # DMG natively — they'd need to build from source or run from a different machine.
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build & test
        run: ./gradlew :shared:jvmTest :desktopApp:createDistributable

      - name: Upload distributable (failures and main only)
        if: failure() || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invoker-${{ matrix.label }}
          path: desktopApp/build/compose/binaries/main/app/
          retention-days: 7
